pcm.i2s_hw {
    type hw
    card 3
    device 0
}

pcm.i2s_plug {
    type plug
    slave.pcm "i2s_hw"
}

pcm.softvol {
    type softvol
    slave {
        pcm "i2s_plug"
    }
    control {
        name "SoftMaster"
        card 0
    }
    min_dB -51.0
    max_dB 0.0
    resolution 100
}

pcm.!default {
    type plug
    slave.pcm "softvol"
}

ctl.!default {
    type hw
    card 0
}

defaults.ctl.card 0
defaults.pcm.card 0
defaults.timer.card 0
